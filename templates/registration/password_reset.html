{% extends "base_h5.html" %}
{% load static %}

{% block title %}忘记密码 - Health Nexus{% endblock %}

{% block nav %}{% endblock %}

{% block main %}
<div class="login-bg absolute inset-0 flex flex-col items-center justify-center px-6">
    <div class="w-full max-w-sm">
        <div class="text-center mb-4 animate-fade-in">
            <div class="w-12 h-12 mx-auto mb-4 rounded-2xl flex items-center justify-center shadow-xl ai-avatar">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white" viewBox="0 0 100 100" fill="none">
                    <g stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M25 20 L25 80"/>
                        <path d="M25 50 L42 50"/>
                        <path d="M42 20 L42 80"/>
                        <path d="M55 80 L55 20"/>
                        <path d="M55 80 L72 20"/>
                        <path d="M72 80 L72 20"/>
                    </g>
                </svg>
            </div>
            <h2 class="text-xl font-bold text-white mb-1">忘记密码</h2>
            <p class="text-white/80 text-sm">通过手机验证码重置您的密码</p>
        </div>

        <div class="login-card rounded-2xl px-5 py-6 animate-slide-up">
            <div x-data="passwordReset()" x-cloak>
                <template x-if="!resetSuccess">
                    <form @submit.prevent="handleSubmit" class="space-y-4">
                        <div class="space-y-3">
                            <div class="relative">
                                <img src="{% static 'images/icons/phone.svg' %}" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-5 h-5" alt="手机号">
                                <input id="phone" name="phone" type="tel" x-model="phone" required
                                    class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all"
                                    placeholder="请输入已绑定的手机号"
                                    autocomplete="healthnexus-tel">
                            </div>

                            <div class="flex gap-3">
                                <div class="relative flex-1">
                                    <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z"/>
                                    </svg>
                                    <input id="verification_code" name="verification_code" type="text" x-model="code" required maxlength="6"
                                        class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all"
                                        placeholder="请输入验证码"
                                        autocomplete="healthnexus-one-time-code">
                                </div>
                                <button type="button" @click="sendCode" :disabled="countdown > 0"
                                    class="shrink-0 px-4 py-3.5 text-sm font-medium rounded-xl transition-all duration-200 whitespace-nowrap"
                                    :class="countdown > 0 ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-sky-50 text-sky-600 hover:bg-sky-100 active:scale-[0.98]'"
                                    x-text="countdown > 0 ? countdown + '秒后重试' : '获取验证码'">
                                </button>
                            </div>

                            <div class="relative">
                                <img src="{% static 'images/icons/lock-closed.svg' %}" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-5 h-5" alt="新密码">
                                <input id="new_password" name="new_password" type="password" x-model="newPassword" required
                                    class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all"
                                    placeholder="请输入新密码（8位以上，含字母和数字）"
                                    autocomplete="healthnexus-new-password">
                            </div>

                            <div class="relative">
                                <img src="{% static 'images/icons/lock-closed.svg' %}" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-5 h-5" alt="确认密码">
                                <input id="confirm_password" name="confirm_password" type="password" x-model="confirmPassword" required
                                    class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all"
                                    placeholder="请再次输入新密码"
                                    autocomplete="healthnexus-new-password">
                            </div>
                        </div>

                        <template x-if="errorMsg">
                            <div class="px-4 py-3 rounded-xl bg-red-50 border border-red-200">
                                <p class="text-sm text-red-700" x-text="errorMsg"></p>
                            </div>
                        </template>

                        <button type="submit" :disabled="submitting"
                            class="w-full py-3.5 text-base font-semibold rounded-xl text-white shadow-md transition-all duration-200 hover:shadow-lg active:scale-[0.98] btn-gradient disabled:opacity-50 disabled:cursor-not-allowed">
                            <span x-show="!submitting">重置密码</span>
                            <span x-show="submitting" class="flex items-center justify-center gap-2">
                                <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                                </svg>
                                提交中...
                            </span>
                        </button>

                        <div class="flex items-center justify-center pt-1">
                            <a href="{% url 'auth:patient_login' %}" class="flex items-center gap-1.5 text-xs text-slate-500 hover:text-sky-600 transition-colors">
                                <img src="{% static 'images/icons/arrow-left.svg' %}" class="w-4 h-4" alt="返回">
                                返回登录
                            </a>
                        </div>
                    </form>
                </template>

                <template x-if="resetSuccess">
                    <div class="text-center py-4">
                        <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-emerald-100 flex items-center justify-center">
                            <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                            </svg>
                        </div>
                        <p class="text-slate-800 font-medium mb-2">密码重置成功</p>
                        <p class="text-sm text-slate-500 mb-4">请使用新密码登录</p>
                        <a href="{% url 'auth:patient_login' %}" class="inline-block w-full py-3.5 text-base font-semibold rounded-xl text-white shadow-md transition-all duration-200 hover:shadow-lg active:scale-[0.98] btn-gradient">
                            前往登录
                        </a>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function passwordReset() {
    return {
        phone: '',
        code: '',
        newPassword: '',
        confirmPassword: '',
        countdown: 0,
        errorMsg: '',
        submitting: false,
        resetSuccess: false,

        sendCode() {
            if (!this.phone || this.phone.length < 11) {
                this.errorMsg = '请先输入有效的手机号';
                return;
            }
            this.errorMsg = '';
            var self = this;
            var formData = new FormData();
            formData.append('phone', this.phone);

            fetch('{% url "auth:password_reset_send_code" %}', {
                method: 'POST',
                headers: { 'X-CSRFToken': getCSRFToken() },
                body: formData
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.message) {
                    self.countdown = 60;
                    var timer = setInterval(function() {
                        self.countdown--;
                        if (self.countdown <= 0) {
                            clearInterval(timer);
                        }
                    }, 1000);
                } else if (data.error) {
                    self.errorMsg = data.error;
                }
            })
            .catch(function() {
                self.errorMsg = '网络错误，请重试';
            });
        },

        handleSubmit() {
            if (this.newPassword !== this.confirmPassword) {
                this.errorMsg = '两次密码输入不一致';
                return;
            }
            if (this.newPassword.length < 8) {
                this.errorMsg = '密码至少 8 位';
                return;
            }
            this.errorMsg = '';
            this.submitting = true;
            var self = this;

            var formData = new FormData();
            formData.append('phone', this.phone);
            formData.append('code', this.code);
            formData.append('new_password', this.newPassword);
            formData.append('confirm_password', this.confirmPassword);

            fetch('{% url "auth:password_reset_confirm" %}', {
                method: 'POST',
                headers: { 'X-CSRFToken': getCSRFToken() },
                body: formData
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                self.submitting = false;
                if (data.message && data.redirect_url) {
                    self.resetSuccess = true;
                } else if (data.error) {
                    self.errorMsg = data.error;
                }
            })
            .catch(function() {
                self.submitting = false;
                self.errorMsg = '网络错误，请重试';
            });
        }
    };
}
</script>
{% endblock %}
