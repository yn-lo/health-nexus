{% extends "base_h5.html" %}

{% block title %}修改密码 - Health Nexus{% endblock %}

{% block content %}
<div class="login-bg flex flex-col items-center justify-center py-8 px-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8 animate-fade-in">
            <div class="w-20 h-20 mx-auto mb-4 rounded-2xl flex items-center justify-center shadow-2xl"
                 style="background: rgba(255,255,255,0.2); backdrop-filter: blur(10px);">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                </svg>
            </div>
            <h2 class="text-3xl font-bold text-white tracking-tight">修改密码</h2>
            <p class="mt-2 text-white/80">请设置您的新密码</p>
        </div>

        <div class="login-card rounded-3xl p-8 animate-slide-up">
            {% if form.errors %}
            <div class="mb-6 p-4 rounded-xl bg-red-50 border border-red-100">
                {% for field, errors in form.errors.items %}
                    {% for error in errors %}
                    <p class="text-sm text-red-700">{{ error }}</p>
                    {% endfor %}
                {% endfor %}
            </div>
            {% endif %}

            <form method="post" class="space-y-5">
                {% csrf_token %}

                <div class="space-y-5">
                    <div class="relative">
                        <svg xmlns="http://www.w3.org/2000/svg" class="input-icon w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                        </svg>
                        <input id="id_old_password" name="old_password" type="password" required
                            class="w-full pl-11 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all"
                            placeholder="请输入原密码">
                    </div>

                    <div class="relative">
                        <svg xmlns="http://www.w3.org/2000/svg" class="input-icon w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                        </svg>
                        <input id="id_new_password1" name="new_password1" type="password" required
                            class="w-full pl-11 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all"
                            placeholder="请输入新密码">
                    </div>

                    <div class="relative">
                        <svg xmlns="http://www.w3.org/2000/svg" class="input-icon w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                        </svg>
                        <input id="id_new_password2" name="new_password2" type="password" required
                            class="w-full pl-11 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all"
                            placeholder="请再次输入新密码">
                    </div>
                </div>

                <button type="submit"
                    class="w-full py-4 text-lg font-bold rounded-xl text-white shadow-lg transition-all duration-200 hover:shadow-xl active:scale-[0.98] btn-gradient">
                    确认修改
                </button>

                <div class="text-center pt-2">
                    <a href="{% url 'care:profile_detail' %}" class="text-base font-medium text-slate-500 hover:text-sky-600">
                        返回个人中心
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
