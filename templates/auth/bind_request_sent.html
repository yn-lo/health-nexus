{% extends "base_h5.html" %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-screen px-4">
    <div class="w-20 h-20 rounded-full bg-green-100 flex items-center justify-center mb-6">
        <svg class="w-10 h-10 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        </svg>
    </div>
    <h1 class="text-2xl font-bold text-slate-900 mb-2">请求已发送</h1>
    <p class="text-slate-600 mb-2">{{ message }}</p>
    <p class="text-sm text-slate-500 mb-8">对方确认后即可完成绑定</p>
    <a href="/" class="px-6 py-3 bg-sky-500 text-white rounded-xl font-medium hover:bg-sky-600">
        返回首页
    </a>
</div>
{% endblock %}
