<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta name="csrf-token" content="{{ csrf_token }}">

    <title>{% block title %}Health Nexus{% endblock %}</title>
    {% load static %}
    <link rel="icon" href="{% static 'images/favicon.svg' %}" type="image/svg+xml">
    <link href="{% static 'css/design-system.css' %}" rel="stylesheet" type="text/css" />
    <script src="{% static 'vendor/tailwindcss/tailwindcss.js' %}"></script>
    <script src="{% static 'vendor/htmx/htmx.js' %}"></script>
    <script src="{% static 'js/utils/csrf.js' %}"></script>
    <script src="{% static 'js/utils/api.js' %}"></script>
    <script src="{% static 'js/utils/sms.js' %}"></script>
    <script src="{% static 'js/alpine/confirmDialog.js' %}"></script>
    <script src="{% static 'js/alpine/renameDialog.js' %}"></script>
    {% block alpine_components %}{% endblock %}
    <script>
        document.addEventListener('htmx:configRequest', function(event) {
            try {
                event.detail.headers['X-CSRFToken'] = getCSRFToken();
            } catch (e) {
                console.error('Failed to set CSRF token:', e.message);
            }
        });
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        primary: '#0EA5E9',
                        'primary-dark': '#0284C7',
                        'primary-light': 'rgba(14, 165, 233, 0.1)',
                        secondary: '#06B6D4',
                        accent: '#22D3EE',
                    },
                    backgroundImage: {
                        'brand-gradient': 'linear-gradient(135deg, #0EA5E9 0%, #06B6D4 100%)',
                        'brand-gradient-dark': 'linear-gradient(135deg, #0EA5E9 0%, #0284C7 100%)',
                        'brand-gradient-full': 'linear-gradient(135deg, #0EA5E9 0%, #06B6D4 50%, #22D3EE 100%)',
                    }
                },
            },
        }
    </script>

    {% block extra_head %}{% endblock %}
    <script src="{% static 'vendor/alpinejs/alpinejs.js' %}" defer></script>
</head>
<body class="text-slate-800 min-h-screen antialiased flex flex-col">
    {% block body %}{% endblock %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
