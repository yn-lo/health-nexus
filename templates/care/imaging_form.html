{% extends "base_h5.html" %}
{% load static %}

{% block title %}新增影像检查 - Health Nexus{% endblock %}

{% block content %}
<div class="flex flex-1 min-h-0 flex-col overflow-hidden">
    <div class="flex-1 overflow-y-auto px-4 py-6">
        <div class="max-w-2xl mx-auto w-full">
    <div class="flex items-center gap-4 mb-6">
        <a href="{% url 'care:imaging_list' %}" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center transition-colors flex-shrink-0">
            <img src="{% static 'images/icons/arrow-left.svg' %}" class="w-6 h-6" alt="返回">
        </a>
        <h1 class="text-xl font-bold text-slate-900">新增影像检查</h1>
    </div>

    {% if messages %}
    <div class="mb-4">
        {% for message in messages %}
        <div class="flex items-center gap-2 px-4 py-3 rounded-xl {% if message.tags == 'success' %}bg-green-50 text-green-700{% else %}bg-red-50 text-red-700{% endif %}">
            <img src="{% static 'images/icons/check-circle.svg' %}" class="w-5 h-5" alt="">
            <span class="text-sm">{{ message }}</span>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <form method="post" class="space-y-6">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">检查类型</label>
            <select name="imaging_type"
                    class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all">
                <option value="">选择检查类型</option>
                <option value="XRAY">X光</option>
                <option value="CT">CT</option>
                <option value="MRI">磁共振(MRI)</option>
                <option value="ULTRASOUND">超声</option>
                <option value="ENDOSCOPY">内窥镜</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">检查部位</label>
            <input type="text" name="body_part"
                   class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all"
                   placeholder="如：胸部、腹部、头部">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">检查日期</label>
            <input type="date" name="exam_date" value="{{ today }}"
                   class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">检查所见</label>
            <textarea name="findings" rows="4"
                      class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all"
                      placeholder="描述检查过程中的发现"></textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">诊断结论</label>
            <textarea name="conclusion" rows="3"
                      class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all"
                      placeholder="医生的诊断结论"></textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">检查机构</label>
            <input type="text" name="source"
                   class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all"
                   placeholder="如：北京协和医院影像科">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">备注</label>
            <textarea name="notes" rows="3"
                      class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all"
                      placeholder="如：增强CT，使用了造影剂"></textarea>
        </div>
        <div>
            <button type="submit" class="w-full py-3 px-4 rounded-xl font-medium bg-brand-gradient text-white hover:opacity-90 transition-all">
                保存记录
            </button>
        </div>
    </form>
        </div>
    </div>
    </div>
{% endblock %}
