{% extends "base_h5.html" %}

{% block title %}添加成员 - {{ department.name }}{% endblock %}

{% block content %}
<div class="px-4 py-4">
    <h2 class="text-xl font-bold text-slate-900 mb-4">添加成员 - {{ department.name }}</h2>

    <form method="post" class="space-y-4">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">选择用户</label>
            <select name="user_id"
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                    required>
                <option value="">请选择用户</option>
                {% for u in users %}
                <option value="{{ u.id }}">{{ u.username }} ({{ u.get_role_display }})</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">角色</label>
            <select name="role"
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                <option value="MEMBER">成员</option>
                <option value="ADMIN">管理员</option>
                <option value="VIEWER">只读成员</option>
            </select>
        </div>

        <div class="flex items-center gap-2">
            <input type="checkbox" name="is_primary" id="is_primary"
                   class="rounded border-slate-300 text-primary focus:ring-primary">
            <label for="is_primary" class="text-sm text-slate-700">设为主科室</label>
        </div>

        <div class="flex items-center gap-3 pt-4">
            <button type="submit" class="flex-1 bg-primary text-white rounded-lg py-2 font-medium hover:bg-primary-dark transition-colors">
                添加
            </button>
            <a href="{% url 'departments:department_list' %}" class="flex-1 bg-slate-100 text-slate-700 rounded-lg py-2 font-medium text-center hover:bg-slate-200 transition-colors">
                取消
            </a>
        </div>
    </form>
</div>
{% endblock %}
