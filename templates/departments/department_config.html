{% extends "base_h5.html" %}

{% block title %}科室配置 - {{ department.name }}{% endblock %}

{% block content %}
<div class="px-4 py-4">
    <h2 class="text-xl font-bold text-slate-900 mb-4">科室配置 - {{ department.name }}</h2>

    <form method="post" class="space-y-4">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">欢迎语</label>
            <textarea name="welcome_msg" rows="3"
                      class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">{{ department.config.welcome_msg|default:"" }}</textarea>
        </div>

        <div class="flex items-center gap-3 pt-4">
            {% if user.is_admin %}
            <button type="submit" class="flex-1 bg-primary text-white rounded-lg py-2 font-medium hover:bg-primary-dark transition-colors">
                保存配置
            </button>
            {% endif %}
            <a href="{% url 'departments:department_list' %}" class="flex-1 bg-slate-100 text-slate-700 rounded-lg py-2 font-medium text-center hover:bg-slate-200 transition-colors">
                返回列表
            </a>
        </div>
    </form>
</div>
{% endblock %}
