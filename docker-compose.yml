# ========================================
# Health Nexus - 完整Docker部署配置
# 用途: 一键部署完整应用栈
# 用法: docker-compose up -d
# ========================================

services:
  # ----------------------------------------
  # PostgreSQL 数据库（带pgvector扩展）
  # ----------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: hn-prod-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-health_nexus_prod}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5231:5432"
    volumes:
      - hn-prod-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
        reservations:
          memory: 512M
          cpus: "0.5"
    networks:
      - hn-network

  # ----------------------------------------
  # Redis 缓存服务
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: hn-prod-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - hn-prod-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
        reservations:
          memory: 128M
          cpus: "0.25"
    networks:
      - hn-network

  # ----------------------------------------
  # Django 应用服务
  # ----------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hn-web
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      Q_REDIS: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      CACHE_REDIS: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1
    ports:
      - "${WEB_PORT:-5230}:${WEB_PORT:-5230}"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/mediafiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${WEB_PORT:-5230}/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2"
        reservations:
          memory: 256M
          cpus: "0.5"
    networks:
      - hn-network
    command: >
      gunicorn
      --bind 0.0.0.0:${WEB_PORT:-5230}
      --workers 3
      --threads 4
      --worker-class gthread
      --timeout 120
      --keep-alive 5
      --access-logfile -
      config.wsgi:application

  # ----------------------------------------
  # Django Q 异步任务 Worker
  # ----------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hn-worker
    restart: always
    entrypoint: []
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      Q_REDIS: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      CACHE_REDIS: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "print('worker alive')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
        reservations:
          memory: 128M
          cpus: "0.25"
    networks:
      - hn-network
    command: python manage.py qcluster

volumes:
  hn-prod-postgres-data:
    driver: local
  hn-prod-redis-data:
    driver: local
  static_data:
    driver: local
  media_data:
    driver: local

networks:
  hn-network:
    driver: bridge
