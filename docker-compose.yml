# Health Nexus 全栈 Docker 部署
# 一键启动: docker compose up -d

name: health-nexus

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hn-postgres
    environment:
      POSTGRES_USER: health
      POSTGRES_PASSWORD: 4b605c71292e231391b2a40d63d9fe5b
      POSTGRES_DB: health_nexus
      TZ: Asia/Shanghai
    # 暴露 5432 供本地开发/测试直接连接；生产环境如需仅内网访问可删除 ports 段。
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health -d health_nexus"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hn-redis
    command: >
      redis-server
      --requirepass 4d58f1021dfc47f2f701a5be6f249a91
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    # 暴露 6379 供本地开发/测试直接连接；生产环境如需仅内网访问可删除 ports 段。
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "4d58f1021dfc47f2f701a5be6f249a91", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  server:
    build: .
    container_name: hn-server
    command: ["/bin/server"]
    ports:
      - "5230:5230"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HEALTH_NEXUS_POSTGRES_DSN: "postgres://health:4b605c71292e231391b2a40d63d9fe5b@postgres:5432/health_nexus?sslmode=disable"
      HEALTH_NEXUS_REDIS_ADDR: "redis:6379"
      HEALTH_NEXUS_REDIS_PASSWORD: "4d58f1021dfc47f2f701a5be6f249a91"
      HEALTH_NEXUS_JWT_SECRET: "38c4d857fd37f230568a8b209ef5337175afc4ac0d3bf00972f572f62b0ada83"
      HEALTH_NEXUS_SECURITY_ENCRYPTION_KEY: "32c93981934e2419a59ea4d1ec66c62a154ed1239dfa11cc27671ff2f3029ea3"
    restart: unless-stopped

  worker:
    build: .
    container_name: hn-worker
    command: ["/bin/worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_started
    environment:
      HEALTH_NEXUS_POSTGRES_DSN: "postgres://health:4b605c71292e231391b2a40d63d9fe5b@postgres:5432/health_nexus?sslmode=disable"
      HEALTH_NEXUS_REDIS_ADDR: "redis:6379"
      HEALTH_NEXUS_REDIS_PASSWORD: "4d58f1021dfc47f2f701a5be6f249a91"
      HEALTH_NEXUS_JWT_SECRET: "38c4d857fd37f230568a8b209ef5337175afc4ac0d3bf00972f572f62b0ada83"
      HEALTH_NEXUS_SECURITY_ENCRYPTION_KEY: "32c93981934e2419a59ea4d1ec66c62a154ed1239dfa11cc27671ff2f3029ea3"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
