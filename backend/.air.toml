# Air hot-reload 配置 — health-nexus backend
# 用法: cd backend && air

root = "."
tmp_dir = "tmp"

[build]
  entrypoint = ["./tmp/server.exe"]
  cmd = "go build -o ./tmp/server.exe ./cmd/server"
  delay = 500
  exclude_dir = ["tmp", "vendor", "tests", "migrations", "cmd/hashpw", "cmd/keygen"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "yaml", "yml"]
  kill_delay = "1s"
  stop_on_error = false

[log]
  time = false

[misc]
  clean_on_exit = true
